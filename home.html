<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog — Home</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>

<header class="site-header">
  <a href="home.html" class="site-logo">LUNO <span>Blog</span></a>
  <nav class="site-nav">
    <a href="index-sidebar.html">記事一覧</a>
  </nav>
</header>

<section class="hero">
  <h1>ようこそ</h1>
  <p>最新情報やお役立ち記事をお届けします。HTML と embed スクリプトだけで公開できます。</p>
  <a href="index-sidebar.html" class="hero-btn">記事一覧を見る →</a>
</section>

<div class="section">
  <div class="section-head">
    <h2 class="section-title">最新記事</h2>
    <a class="section-more" href="index-sidebar.html">すべて見る →</a>
  </div>

  <div class="page-with-sidebar">
    <div class="widget-surface" data-luno-top
         data-widget-id="YOUR_WIDGET_ID"
         data-api-key="YOUR_PUBLIC_API_KEY"
         data-api-url="https://YOUR_API_DOMAIN"
         data-count="5"
         data-link-pattern="article.html?entry={slug}"
         data-see-more-url="index-sidebar.html"
         data-see-more-label="もっと見る">
    </div>

    <aside class="sidebar">
      <div class="sidebar-panel">
        <h2>最近の投稿</h2>
        <div data-luno-top
             data-widget-id="YOUR_WIDGET_ID"
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-count="5"
             data-link-pattern="article.html?entry={slug}"
             data-no-thumbnail="true">
        </div>
      </div>

      <div class="sidebar-panel">
        <h2>カテゴリ</h2>
        <div data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="category"
             data-target="YOUR_WIDGET_ID">
        </div>
      </div>

      <div class="sidebar-panel">
        <h2>タグ</h2>
        <div data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="tags"
             data-target="YOUR_WIDGET_ID">
        </div>
      </div>
    </aside>
  </div>
</div>

<footer class="site-footer">
  Powered by <a href="https://luno.app" target="_blank" rel="noopener">LUNO</a>
</footer>

<script src="https://YOUR_API_DOMAIN/public/v1/embed/YOUR_WIDGET_ID.js?api_key=YOUR_PUBLIC_API_KEY" async></script>
</body>
</html>
