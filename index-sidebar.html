<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事一覧 — LUNO widget starter (sidebar)</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>

<header class="site-header">
  <a href="home.html" class="site-logo">LUNO <span>Blog</span></a>
  <nav class="site-nav">
    <a href="index.html">トップバー版</a>
  </nav>
</header>

<main class="page">
  <div class="page-intro">
    <h1>記事一覧</h1>
    <p>メインに一覧、サイドバーに検索・フィルター・最新記事を配置したレイアウトです。</p>
  </div>

  <div class="page-with-sidebar">
    <div class="widget-surface" id="luno-list"
         data-api-key="YOUR_PUBLIC_API_KEY"
         data-api-url="https://YOUR_API_DOMAIN"
         data-widget-id="YOUR_WIDGET_ID">
    </div>

    <aside class="sidebar">
      <div class="sidebar-panel">
        <h2>検索</h2>
        <div data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="search"
             data-target="YOUR_WIDGET_ID"
             data-placeholder="記事を検索...">
        </div>
      </div>

      <div class="sidebar-panel">
        <h2>絞り込み</h2>
        <div data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="category"
             data-target="YOUR_WIDGET_ID">
        </div>
        <div style="margin-top: 0.75rem" data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="monthly"
             data-target="YOUR_WIDGET_ID">
        </div>
        <div style="margin-top: 0.75rem" data-luno-filter
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-type="tags"
             data-target="YOUR_WIDGET_ID">
        </div>
      </div>

      <div class="sidebar-panel">
        <h2>最新記事</h2>
        <div data-luno-top
             data-widget-id="YOUR_WIDGET_ID"
             data-api-key="YOUR_PUBLIC_API_KEY"
             data-api-url="https://YOUR_API_DOMAIN"
             data-count="5"
             data-link-pattern="article.html?entry={slug}"
             data-see-more-url="index-sidebar.html"
             data-see-more-label="もっと見る">
        </div>
      </div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  Powered by <a href="https://luno.app" target="_blank" rel="noopener">LUNO</a>
</footer>

<script src="https://YOUR_API_DOMAIN/public/v1/embed/YOUR_WIDGET_ID.js?api_key=YOUR_PUBLIC_API_KEY" async></script>
</body>
</html>
